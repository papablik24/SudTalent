services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sudtalent-backend
    ports:
      - "8080:8080"
    env_file:
      - ./backend/.env
    environment:
      # Sobreescribir CORS para que apunte al frontend en Docker
      APP_CORS_ALLOWED_ORIGINS: "http://localhost"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Variables de entorno de Vite en build-time
        VITE_BACKEND_URL: "http://localhost:8080/api"
        VITE_SUPABASE_URL: "${VITE_SUPABASE_URL}"
        VITE_SUPABASE_ANON_KEY: "${VITE_SUPABASE_ANON_KEY}"
        VITE_SUPABASE_PROJECT_ID: "${VITE_SUPABASE_PROJECT_ID}"
    container_name: sudtalent-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
